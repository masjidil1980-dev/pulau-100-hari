name: Render video
on: workflow_dispatch
jobs:
  chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        part: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: |
          sudo apt-get update && sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2
      - run: |
          S=$(( ${{ matrix.part }} * 546 )); E=$(( S + 545 )); [ $E -gt 4365 ] && E=4365
          mkdir -p out
          npx remotion render src/index.jsx Story out/part${{ matrix.part }}.mp4 --frames=$S-$E --gl=angle --concurrency=4 --image-format=jpeg --jpeg-quality=92 --crf=17
      - uses: actions/upload-artifact@v4
        with: {name: part${{ matrix.part }}, path: out/part${{ matrix.part }}.mp4}
  join:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: parts}
      - run: |
          for i in 0 1 2 3 4 5 6 7; do echo "file 'parts/part$i/part$i.mp4'" >> list.txt; done
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy silent.mp4
          ffmpeg -y -i silent.mp4 -i voiceover.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final.mp4
      - uses: actions/upload-artifact@v4
        with: {name: final-video, path: final.mp4}
