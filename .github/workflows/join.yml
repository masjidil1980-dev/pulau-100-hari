name: Join video
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Nomor run"
        required: true
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          for i in 0 1 2 3 4 5 6 7; do echo "file 'parts/part$i/part$i.mp4'" >> list.txt; done
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy silent.mp4
          ffmpeg -y -i silent.mp4 -i voiceover.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
